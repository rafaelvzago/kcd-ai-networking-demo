<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="assets/asciinema-player.css">
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 960px; margin: 0 auto; padding: 3rem 1.25rem; }
    a { color: #0969da; }
    @media (prefers-color-scheme: dark) { a { color: #58a6ff; } }

<body>
  <p><a href="index.html">← Voltar ao índice</a></p>

  <p><a href="inference-demo.cast" download>Baixar gravação (.cast)</a></p>
  <div id="demo"></div>
  <script src="assets/asciinema-player.min.js"></script>

    AsciinemaPlayer.create('inference-demo.cast', document.getElementById('demo'), {

      cols: 120,
      rows: 40,
      pauseOnMarkers: true
    });
