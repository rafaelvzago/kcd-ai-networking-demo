apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-inference-gateway
  namespace: ai-networking-demo
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fast-inference-gateway
  namespace: ai-networking-demo
  labels:
    istio.io/enable-inference-extproc: "true"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: fast-inference-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
