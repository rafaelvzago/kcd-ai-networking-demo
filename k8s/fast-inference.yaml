apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-simulator
  namespace: ai-networking-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fast-simulator
  template:
    metadata:
      labels:
        app: fast-simulator
    spec:
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
          args: ["--model", "fast", "--port", "8000", "--mode", "echo", "--time-to-first-token", "100ms", "--enable-request-id-headers"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-simulator
  namespace: ai-networking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-simulator
  template:
    metadata:
      labels:
        app: quality-simulator
    spec:
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
          args: ["--model", "quality", "--port", "8000", "--mode", "echo", "--time-to-first-token", "500ms", "--enable-request-id-headers"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-client
  namespace: ai-networking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-client
  template:
    metadata:
      labels:
        app: fast-client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.15.0
          command: ["sleep", "infinity"]
