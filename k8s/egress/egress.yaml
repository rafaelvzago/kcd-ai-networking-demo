apiVersion: v1
kind: Secret
metadata:
  name: upstream-api-key
  namespace: ai-networking-demo
type: Opaque
stringData:
  Authorization: demo-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client-app
  namespace: ai-networking-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-mock-llm
  namespace: ai-networking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-mock-llm
  template:
    metadata:
      labels:
        app: external-mock-llm
    spec:
      containers:
        - name: mock-llm
          image: mock-llm-server:dev
          imagePullPolicy: Never
          env:
            - name: INSTANCE_NAME
              value: external-mock
            - name: REQUIRED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upstream-api-key
                  key: Authorization
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: external-mock-llm
  namespace: ai-networking-demo
spec:
  selector:
    app: external-mock-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  namespace: ai-networking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      serviceAccountName: client-app
      containers:
        - name: client
          image: curlimages/curl:8.15.0
          command: ["sleep", "infinity"]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: external-mock-llm
  namespace: ai-networking-demo
spec:
  ai:
    provider:
      custom:
        backendRef:
          name: external-mock-llm
          port: 8080
        formats:
          - type: Completions
  policies:
    auth:
      secretRef:
        name: upstream-api-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egress-chat
  namespace: ai-networking-demo
spec:
  parentRefs:
    - name: llm-d-inference-gateway
      namespace: ai-networking-demo
  hostnames: ["egress.local"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: external-mock-llm
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: egress-token-limit
  namespace: ai-networking-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: egress-chat
  traffic:
    rateLimit:
      local:
        - tokens: 20
          unit: Minutes
