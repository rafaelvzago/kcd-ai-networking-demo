name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download asciinema player
        run: |
          mkdir -p docs/assets
          curl --fail --location --silent --show-error \
            https://github.com/asciinema/asciinema-player/releases/latest/download/asciinema-player.min.js \
            --output docs/assets/asciinema-player.min.js
          curl --fail --location --silent --show-error \
            https://github.com/asciinema/asciinema-player/releases/latest/download/asciinema-player.css \
            --output docs/assets/asciinema-player.css
          test -s docs/assets/asciinema-player.min.js
          test -s docs/assets/asciinema-player.css
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
