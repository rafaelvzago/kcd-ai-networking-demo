name: Validate demo

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: helm/kind-action@v1.13.0
      - run: make test
      - run: make demo
      - run: make validate-demo
