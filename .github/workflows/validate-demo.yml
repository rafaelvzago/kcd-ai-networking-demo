name: Validate demo

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1.13.0
      - run: sudo sysctl -w fs.inotify.max_user_instances=512
      - run: make model-routing
      - run: make rehearse-offline
